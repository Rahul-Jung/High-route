<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide App — High Route</title>
<style>
  :root{ --ink:#15140F; --stone:#211F19; --paper:#F2EEE2; --dim:#C9C4B2; --signal:#FF4E1F; --glacier:#6FA0B8; --line:rgba(242,238,226,0.14); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--ink); color:var(--paper); font-family:Inter,system-ui,sans-serif; }
  .wrap{ max-width:640px; margin:0 auto; padding:40px 20px 80px; }
  h1{ font-size:20px; margin-bottom:4px; } h1 b{ color:var(--signal); }
  .sub{ color:var(--dim); font-size:13px; margin-bottom:30px; }
  input, button, textarea{ font-family:inherit; font-size:14px; }
  input, textarea{ width:100%; background:var(--stone); border:1px solid var(--line); color:var(--paper); padding:11px 13px; margin-bottom:12px; }
  button{ background:var(--signal); border:0; color:var(--ink); font-weight:700; padding:11px 18px; cursor:pointer; }
  button.ghost{ background:transparent; border:1px solid var(--line); color:var(--dim); }
  .card{ background:var(--stone); border:1px solid var(--line); padding:20px; margin-bottom:18px; }
  .card h3{ margin:0 0 4px; font-size:18px; }
  .meta{ color:var(--dim); font-size:12px; font-family:monospace; margin-bottom:14px; }
  .rider-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
  .hidden{ display:none; }
  .toast{ font-size:12px; color:var(--glacier); margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>◆ HIGH ROUTE <b>GUIDE</b></h1>
  <div class="sub">Demo credential seeded for every guide: <code>tashi@highroutemtb.demo</code> / <code>ride-nepal-2026</code></div>

  <div id="login-box">
    <input id="email" type="email" placeholder="Guide email" value="tashi@highroutemtb.demo">
    <input id="password" type="password" placeholder="Password" value="ride-nepal-2026">
    <button onclick="login()">Sign in</button>
    <div id="login-error" class="toast" style="color:#D9534F;"></div>
  </div>

  <div id="app" class="hidden">
    <div id="departures"></div>
  </div>
</div>

<script>
function token(){ return localStorage.getItem('hr_guide_token'); }
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/guide/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password}) });
  const data = await res.json();
  if (!res.ok) { document.getElementById('login-error').textContent = data.error; return; }
  localStorage.setItem('hr_guide_token', data.token);
  localStorage.setItem('hr_guide_name', data.guide.name);
  boot();
}

async function api(path, opts={}){
  const res = await fetch(path, { ...opts, headers: { 'Content-Type':'application/json', Authorization: 'Bearer ' + token(), ...(opts.headers||{}) } });
  return res.json();
}

async function boot(){
  document.getElementById('login-box').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const data = await api('/api/guide/today');
  const el = document.getElementById('departures');
  if (!data.departures || !data.departures.length) {
    el.innerHTML = '<p class="toast">No active departures assigned to you right now.</p>';
    return;
  }
  el.innerHTML = data.departures.map(d => `
    <div class="card">
      <h3>${esc(d.tour_name)}</h3>
      <div class="meta">${esc(d.start_date)} → ${esc(d.end_date)} · ${d.riders.length} riders · status: ${esc(d.status)}</div>
      ${d.riders.map(r => `
        <div class="rider-row">
          <span>${esc(r.name)}${r.riding_experience ? ' · ' + esc(r.riding_experience) : ''}</span>
          <button class="ghost" style="padding:5px 10px; font-size:11px;" onclick="checkin(${d.id}, ${r.id}, this)">Check in</button>
        </div>`).join('') || '<p class="toast">No riders booked yet.</p>'}

      <div style="margin-top:16px;">
        <textarea id="msg-${d.id}" rows="2" placeholder="Post a status update or day briefing..."></textarea>
        <button onclick="postStatus(${d.id})">Post update</button>
        <button class="ghost" style="margin-left:8px;" onclick="reportIncident(${d.id})">Report incident</button>
      </div>
      <div id="toast-${d.id}" class="toast"></div>
    </div>
  `).join('');
}

async function checkin(departureId, bookingRiderId, btn){
  await api('/api/guide/checkin', { method:'POST', body: JSON.stringify({ departureId, bookingRiderId }) });
  btn.textContent = 'Checked in ✓';
  btn.disabled = true;
}
async function postStatus(departureId){
  const msg = document.getElementById('msg-'+departureId).value;
  if (!msg) return;
  await api('/api/guide/status', { method:'POST', body: JSON.stringify({ departureId, message: msg }) });
  document.getElementById('toast-'+departureId).textContent = 'Posted to the trip feed.';
  document.getElementById('msg-'+departureId).value = '';
}
async function reportIncident(departureId){
  const msg = document.getElementById('msg-'+departureId).value || 'Incident reported (no details given)';
  await api('/api/guide/incident', { method:'POST', body: JSON.stringify({ departureId, message: msg }) });
  document.getElementById('toast-'+departureId).textContent = 'Incident logged.';
  document.getElementById('msg-'+departureId).value = '';
}

if (token()) boot();
</script>
</body>
</html>
