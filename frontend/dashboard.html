<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | High Route MTB Nepal</title>
<meta name="description" content="Manage your profile, bookings and custom trip requests.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div data-site-header></div>

<!-- The main landmark. Without one, shell.js used to promote the first block
     here and overwrite its id, which is what broke the dashboard. -->
<main id="main">

<div id="dash-gate" class="dash-gate hidden">
  <h2>Sign in to view your account</h2>
  <p style="color:var(--paper-dim); margin:14px 0 24px; font-size:15px;">Your profile, bookings and custom trip requests all live here once you're signed in.</p>
  <button class="btn btn-solid" id="dash-signin-btn">Sign in</button>
</div>

<div id="dash-app" class="hidden">
  <section class="page-hero">
    <div class="topo-bg"></div>
    <div class="wrap" style="position:relative;">
      <div class="detail-crumb"><a href="index.html">Home</a> / My account</div>
      <h1>My account</h1>
      <p id="dash-welcome" style="color:var(--paper-dim); margin-top:10px;">—</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="dash-grid">

        <div class="dash-card">
          <h3>Your profile</h3>
          <form id="profile-form">
            <div class="dash-field"><label for="p-name">Name</label><input id="p-name" required></div>
            <div class="dash-field"><label for="p-email">Email</label><input id="p-email" disabled></div>
            <div class="dash-row">
              <div class="dash-field"><label for="p-phone">Phone</label><input id="p-phone"></div>
              <div class="dash-field"><label for="p-country">Country</label><input id="p-country"></div>
            </div>
            <div class="dash-field"><label for="p-experience">Riding experience</label>
              <select id="p-experience">
                <option value="">Not set</option>
                <option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Expert</option>
              </select>
            </div>
            <div class="dash-field"><label for="p-style">Preferred style</label><input id="p-style" placeholder="Enduro, Trail..."></div>
            <div class="dash-field"><label for="p-bike">Bike info</label><input id="p-bike" placeholder="Make/model, size..."></div>
            <div class="dash-row">
              <div class="dash-field"><label for="p-ec-name">Emergency contact name</label><input id="p-ec-name"></div>
              <div class="dash-field"><label for="p-ec-phone">Emergency contact phone</label><input id="p-ec-phone"></div>
            </div>
            <button type="submit" class="btn btn-solid btn-block">Save profile</button>
            <p id="profile-note" style="font-size:12.5px; margin-top:10px; min-height:16px;"></p>
          </form>

          <h3 style="margin-top:32px;">Change password</h3>
          <form id="password-form">
            <div class="dash-field"><label for="p-current-pw">Current password</label><input type="password" id="p-current-pw" autocomplete="current-password"></div>
            <div class="dash-field"><label for="p-new-pw">New password</label><input type="password" id="p-new-pw" autocomplete="new-password" minlength="8"></div>
            <button type="submit" class="btn btn-ghost btn-block">Update password</button>
            <p id="password-note" style="font-size:12.5px; margin-top:10px; min-height:16px;"></p>
          </form>
        </div>

        <div>
          <div class="dash-section-title">Your bookings</div>
          <div class="dash-list" id="bookings-list"><p class="dash-empty">Loading…</p></div>

          <div class="dash-section-title">Your custom requests</div>
          <div class="dash-list" id="requests-list"><p class="dash-empty">Loading…</p></div>
        </div>

      </div>
    </div>
  </section>
</div>

</main>

<div data-site-footer></div>

<script src="shell.js"></script>
<script src="config.js"></script>
<script src="main.js"></script>
</body>
</html>
